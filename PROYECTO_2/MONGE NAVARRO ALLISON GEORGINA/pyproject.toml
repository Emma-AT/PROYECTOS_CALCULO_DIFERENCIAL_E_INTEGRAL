[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
# N803/N806: se permiten nombres en mayúscula como F, G, L o N,
# porque son los mismos símbolos que usa el modelo matemático.
ignore = ["N802", "N803", "N806"]
