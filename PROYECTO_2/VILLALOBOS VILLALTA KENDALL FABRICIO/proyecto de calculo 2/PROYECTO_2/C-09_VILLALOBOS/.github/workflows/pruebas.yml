name: pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Estilo (ruff)
        run: |
          ruff check src tests app.py
          ruff format --check src tests app.py
      - name: Pruebas (pytest)
        run: pytest -v
      - name: Reproducibilidad (resultados y cuaderno)
        run: |
          python -m src.reporte
          jupyter nbconvert --to notebook --execute analisis.ipynb --output /tmp/analisis_ci.ipynb
