greenTextColor = "#1B5E20"
blueColor = "#2E7D32"
blueBackgroundColor = "#EEF6EE"
blueTextColor = "#1B5E20"
redColor = "#111111"
redBackgroundColor = "#F0F0F0"
redTextColor = "#111111"
orangeColor = "#333333"
orangeBackgroundColor = "#F4F4F4"
