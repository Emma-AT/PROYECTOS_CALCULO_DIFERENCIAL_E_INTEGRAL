[theme]
base = "light"
primaryColor = "#2E7D32"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF6EE"
textColor = "#111111"
linkColor = "#1B5E20"
borderColor = "#CFE3D0"
font = "sans-serif"
headingFontWeights = [700, 700, 650, 600, 600, 600]
baseRadius = "large"
buttonRadius = "medium"
metricValueFontWeight = 700

greenColor = "#2E7D32"
