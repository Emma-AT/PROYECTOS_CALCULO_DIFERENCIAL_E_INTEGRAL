dataframeBorderColor = "#CFE3D0"
chartCategoricalColors = ["#81C784", "#2E7D32", "#1B5E20", "#111111", "#A5D6A7", "#4CAF50"]

[theme.sidebar]
backgroundColor = "#F4FAF4"
secondaryBackgroundColor = "#FFFFFF"
