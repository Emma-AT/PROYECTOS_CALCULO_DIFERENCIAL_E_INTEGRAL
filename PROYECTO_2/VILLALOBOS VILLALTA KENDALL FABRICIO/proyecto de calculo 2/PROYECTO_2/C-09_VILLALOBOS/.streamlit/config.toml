yellowColor = "#333333"
yellowBackgroundColor = "#F4F4F4"
yellowTextColor = "#111111"
grayColor = "#555555"
grayBackgroundColor = "#F2F2F2"
grayTextColor = "#333333"

dataframeHeaderBackgroundColor = "#E3F1E3"
