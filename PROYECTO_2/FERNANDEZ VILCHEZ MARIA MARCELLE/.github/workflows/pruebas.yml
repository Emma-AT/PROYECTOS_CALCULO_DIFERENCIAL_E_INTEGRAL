# Integración continua: corre estilo y pruebas en cada push y pull request.
# IMPORTANTE: GitHub solo ejecuta flujos que estén en la carpeta .github/ de la RAÍZ
# del repositorio. Si el proyecto vive en PROYECTO_2/FERNANDEZ VILCHEZ MARIA MARCELLE/, copia esta
# carpeta .github/ a la raíz del repositorio (el valor de `directorio` ya apunta ahí).
name: pruebas

on:
  push:
  pull_request:

env:
  directorio: "PROYECTO_2/FERNANDEZ VILCHEZ MARIA MARCELLE"

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.directorio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "PROYECTO_2/FERNANDEZ VILCHEZ MARIA MARCELLE/requirements.txt"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Estilo (ruff y black)
        run: |
          ruff check .
          black --check .
      - name: Pruebas (pytest)
        run: python -m pytest -q
