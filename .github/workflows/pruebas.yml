name: pruebas

on: [push, pull_request]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "PROYECTO_2/AGUIRRE TORRES EMMA SOFIA"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
